[package]
name = "edge-sandbox"
version = "3.2.2"
edition = "2024"
autobins = false
rust-version = "1.93"
license = "MIT"
description = "Offline Microsoft Edge-compatible JavaScript sandbox with Rust-native Web APIs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aes = "0.8.4"
bincode = "1.3.3"
cbc = { version = "0.1.2", features = ["alloc"] }
cipher = { version = "0.4.4", features = ["alloc", "block-padding"] }
ego-tree = "0.11"
hkdf = "0.12.4"
hmac = "0.12.1"
html5ever = "0.39"
libm = "0.2.16"
miniz_oxide = "0.8.9"
pbkdf2 = "0.12.2"
scraper = { version = "0.27", default-features = false, features = ["deterministic"] }
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
url = "2.5"
v8 = "150.2.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
