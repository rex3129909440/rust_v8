<!doctype html>
<meta charset="utf-8">
<title>iframe client metrics probe</title>
<pre id="output">pending</pre>
<script>
(() => {
  const iframeDocument = `<!DOCTYPE html><html><head></head><body><script>
window.KPSDK = {};
KPSDK.now = typeof performance !== 'undefined' && performance.now
  ? performance.now.bind(performance)
  : Date.now.bind(Date);
KPSDK.start = KPSDK.now();
<\/script></body></html>`;
  const cases = [
    ["normal", ""],
    ["display-none", "display:none"],
    ["visibility-hidden", "visibility:hidden"],
    ["hidden-attribute", "", true],
    ["zero-box", "width:0;height:0;border:0"],
    ["zero-box-child23", "width:0;height:0;border:0", false, "<div style='height:23px'></div>"],
    ["display-none-child23", "display:none", false, "<div style='height:23px'></div>"],
    ["offscreen", "position:absolute;left:-10000px;top:-10000px"],
    ["opacity-zero", "opacity:0"],
  ];
  const results = [];
  let pending = cases.length;
  for (const [name, cssText, hidden, bodyMarkup = ""] of cases) {
    const frame = document.createElement("iframe");
    frame.dataset.case = name;
    frame.style.cssText = cssText;
    if (hidden) frame.hidden = true;
    frame.onload = () => {
      const child = frame.contentWindow;
      const html = frame.contentDocument.documentElement;
      const body = frame.contentDocument.body;
      const rect = frame.getBoundingClientRect();
      results.push({
        name,
        frameClient: [frame.clientWidth, frame.clientHeight],
        frameOffset: [frame.offsetWidth, frame.offsetHeight],
        frameRect: [rect.width, rect.height],
        inner: [child.innerWidth, child.innerHeight],
        htmlClient: [html.clientWidth, html.clientHeight],
        bodyClient: [body.clientWidth, body.clientHeight],
        htmlScroll: [html.scrollWidth, html.scrollHeight],
        bodyScroll: [body.scrollWidth, body.scrollHeight],
      });
      pending -= 1;
      if (pending === 0) {
        results.sort((a, b) => cases.findIndex(x => x[0] === a.name) - cases.findIndex(x => x[0] === b.name));
        document.getElementById("output").textContent = JSON.stringify(results);
        document.documentElement.dataset.complete = "true";
      }
    };
    frame.srcdoc = iframeDocument.replace("</body>", bodyMarkup + "</body>");
    document.body.appendChild(frame);
  }
})();
</script>
