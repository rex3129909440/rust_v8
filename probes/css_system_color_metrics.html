<!doctype html>
<meta charset="utf-8">
<pre id="output">pending</pre>
<script>
(() => {
  const tokens = [
    "ActiveBorder",
    "ActiveCaption", "AppWorkspace", "Background", "ButtonFace",
    "ButtonHighlight", "ButtonShadow", "ButtonText", "CaptionText",
    "GrayText", "Highlight", "HighlightText", "InactiveBorder",
    "InactiveCaption", "InactiveCaptionText", "InfoBackground", "InfoText",
    "Menu", "MenuText", "Scrollbar", "ThreeDDarkShadow", "ThreeDFace",
    "ThreeDHighlight", "ThreeDLightShadow", "ThreeDShadow", "Window",
    "WindowFrame", "WindowText",
    "FakeColor",
    "-moz-ButtonDefault", "-moz-ButtonHoverFace", "-moz-ButtonHoverText",
    "-moz-CellHighlight", "-moz-CellHighlightText", "-moz-Combobox",
    "-moz-ComboboxText", "-moz-Dialog", "-moz-DialogText",
    "-moz-dragtargetzone", "-moz-EvenTreeRow", "-moz-Field",
    "-moz-FieldText", "-moz-html-CellHighlight", "-moz-html-CellHighlightText",
    "-moz-mac-accentdarkestshadow", "-moz-mac-accentdarkshadow",
    "-moz-mac-accentface", "-moz-mac-accentlightesthighlight",
    "-moz-mac-accentlightshadow", "-moz-mac-accentregularhighlight",
    "-moz-mac-accentregularshadow", "-moz-mac-chrome-active",
    "-moz-mac-chrome-inactive", "-moz-mac-focusring", "-moz-mac-menuselect",
    "-moz-mac-menushadow", "-moz-mac-menutextselect", "-moz-MenuHover",
    "-moz-MenuHoverText", "-moz-MenuBarText", "-moz-MenuBarHoverText",
    "-moz-nativehyperlinktext", "-moz-OddTreeRow",
    "-moz-win-communicationstext", "-moz-win-mediatext",
    "-moz-win-accentcolor", "-moz-win-accentcolortext",
    "-moz-activehyperlinktext", "-moz-default-background-color",
    "-moz-default-color", "-moz-hyperlinktext", "-moz-visitedhyperlinktext",
  ];
  const results = tokens.map(token => {
    const element = document.createElement("div");
    document.body.appendChild(element);
    element.style.color = token;
    const computed = getComputedStyle(element);
    return {
      token,
      supports: CSS.supports("color", token),
      inlineColor: element.style.color,
      computedColor: computed.color,
      tokenAsPropertyName: computed.getPropertyValue(token),
    };
  });
  const retained = document.createElement("div");
  document.body.appendChild(retained);
  retained.style.color = "rgb(0, 0, 0)";
  retained.style.color = "FakeColor";
  results.push({
    token: "FakeColor-after-black",
    supports: CSS.supports("color", "FakeColor"),
    inlineColor: retained.style.color,
    computedColor: getComputedStyle(retained).color,
    tokenAsPropertyName: getComputedStyle(retained).getPropertyValue("FakeColor"),
  });
  document.getElementById("output").textContent = JSON.stringify(results);
})();
</script>
